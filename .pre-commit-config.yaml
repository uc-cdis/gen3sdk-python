repos:
    # nbstripout removes cell outputs from any jupyter notebooks to ensure 
    # no accidental commit of responses / secrets
-   repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
    -   id: nbstripout
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: no-commit-to-branch
    # TODO: enable these in a future PR
    # -   id: trailing-whitespace
    # -   id: end-of-file-fixer
        args: [--branch, develop, --branch, master, --branch, main, --pattern, release/.*]
-   repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
    -   id: black
        additional_dependencies: ['click']
-   repo: git@github.com:Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    -   id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '(docs\/_build|poetry.lock)'