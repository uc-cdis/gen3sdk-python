[tool.poetry]
name = "gen3"
homepage = "https://gen3.org/"
version = "5.0.0"
description = "Gen3 CLI and Python SDK"
authors = ["Center for Translational Data Science at the University of Chicago <support@gen3.org>"]
license = "Apache-2.0"
packages = [
    { include = "gen3" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[tool.poetry.dependencies]
python = ">=3.13, <4"
requests = "*"
httpx2 = ">=2.9.1"
indexclient = ">=2.3.0"
drsclient = ">=0.3.0"
aiohttp = "*"
backoff = "*"
cdislogging = ">=1.1.0"
click = "*"
importlib_metadata = ">=8,<9"
jsonschema = "*"
# FIXME updating to >=0.6.0 breaks a few tests
dataclasses-json = "<=0.5.9"
pypfb = ">=0.6.2"
tqdm = ">=4.61.2"
humanfriendly ="*"
python-dateutil = "*"
aiofiles = "*"
pandas = ">=1.4.2"
xmltodict = ">=0.13.0"
gen3users = "*"
joserfc = ">=1.7.3"

authutils = {git = "https://github.com/uc-cdis/authutils.git", rev = "feat/dpop"}

# A list of all of the optional dependencies, some of which are included in the
# below `extras`. They can be opted into by apps.
# fhir
fhirclient = { version = "*", optional = true }

# dpop
uvicorn = { version = "*", optional = true }

[tool.poetry.extras]
fhir = ["fhirclient"]
dpop = ["uvicorn"]

[tool.poetry.group.dev.dependencies]
pytest = ">=6.0.0"
pytest-cov = "*"
requests-mock = "*"
cdisutilstest = { git = "https://github.com/uc-cdis/cdisutils-test.git", tag = "2.0.0" }
# Can't be locked while authutils is pinned to the feat/dpop branch (8.1.0):
# indexd 5.0.4 requires authutils <7.0.0. tests/conftest.py still imports it, so
# install it by hand until authutils 8 is released and indexd picks it up.
# TODO FIXME
# indexd = { git = "https://github.com/uc-cdis/indexd.git", tag = "5.0.4" }
deptry = ">=0.23.1"

[tool.poetry.scripts]
gen3 = "gen3.cli.__main__:main"

[tool.poetry.plugins."gen3.plugins"]

[build-system]
requires = ["poetry>=1.4.1"]
build-backend = "poetry.masonry.api"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-vv"
testpaths = [
    "tests",
]
